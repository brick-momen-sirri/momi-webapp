name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 matches production (pm2). The backend's better-sqlite3 is a
      # native module built for this ABI, so CI must run the same major.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (via corepack, pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency vulnerability gate
        run: pnpm audit --prod --audit-level high

      # Formatting and lint run before the slower type-check and test steps, so a
      # style-only failure reports in seconds instead of minutes.
      - name: Format check
        run: pnpm run format:check

      # The repository has a zero-warning policy; any warning fails CI.
      - name: Lint
        run: pnpm run lint

      - name: Backend type-check
        run: pnpm --filter momi-animation-backend exec tsc --noEmit

      - name: Backend tests and coverage gate
        run: pnpm --filter momi-animation-backend run test:coverage

      - name: Frontend tests and coverage gate
        run: pnpm run test:coverage

      - name: Frontend build (type-check + vite)
        run: pnpm run build

      - name: Install browser for production E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Compiled production gateway E2E
        run: pnpm run test:e2e:production

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/frontend
            backend/coverage/backend
            playwright-report
            test-results
